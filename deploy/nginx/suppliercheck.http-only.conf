# ============================================================================
# 供应商智审 SupplierCheck · 反向代理【阶段一：仅 HTTP】
#
# ⚠️ 这是 DNS 生效前的过渡态配置，签发证书后会被
#    deploy/scripts/enable-https.sh 用带 443 的正式配置整份替换掉。
#
# 为什么是「先 HTTP」而不是「先 80 跳 443」：
#   证书还没签发，此时 301 到 https 只会把唯一可用的入口也打不开。
#   先直接代理，DNS 一生效就是一个能访问的站点，没有中间态的坏窗口。
#
# 与现有配置的关系（安全约定）：
#   - 独立 server 块，server_name 唯一，**不设 default_server**；
#   - 不修改、不覆盖 ultron.conf / lead-webhook.conf；
#   - 文件必须以 .conf 结尾才会被 nginx.conf 的 include 加载。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name supplier.ultron.xin;

    # Let's Encrypt HTTP-01 校验（webroot 与 certbot --webroot -w /var/www/html 对应）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 上传资料包：单文件上限 20 MB，留出 multipart 边界与头部余量
    client_max_body_size 30m;

    # 上传接口：关闭请求体缓冲，字节流直接透传给应用。
    # 默认行为是 nginx 先把整个请求体缓冲到磁盘再转发 —— 对上传来说
    # 等于每个文件写两次盘，且大文件首字节延迟明显。应用自己就是流式写入的。
    location /api/documents/upload {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
